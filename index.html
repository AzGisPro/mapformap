<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Save the Date</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background-color: #001f3f;
      color: white;
    }

    #map {
      height: 500px;
      width: 100%;
    }

    section {
      padding: 2rem;
    }

    h1{
      text-align: center;
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }

    h2 {
      text-align: center;
      margin-top: 0;
      font-size: 1.8rem;
    }
  </style>
</head>

<body>

  <section>
    <h1>Save the Date</h1>
    <h2>28.11.2025</h2>
  </section>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <script>
    // Map centered on Vienna, Austria
    var map = L.map('map').setView([48.2082, 16.3738], 12);

    // Basemap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);
  </script>

</body>
</html>
